---
# Variables por defecto / survey (AAP puede sobrescribir en launch)
env: dev
server_name: "web.lab.local"
http_port: 80
welcome_message: "Workathon AAP — hola desde CaC"
deploy_windows: true

# Paquete web Linux: nginx | httpd
web_package: nginx
web_service: nginx
web_root: /usr/share/nginx/html
web_conf_dest: /etc/nginx/conf.d/workathon.conf

# Windows / IIS
iis_site_name: Workathon
iis_physical_path: C:\inetpub\workathon

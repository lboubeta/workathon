---
# JT tN-apply-cac — usado por EDA tras un push.
# Opción A (default): redeploy web leyendo vars del repo.
# Opción B: descomentar el bloque controller para aplicar AAC.

- name: CaC apply — redeploy web from Git vars
  ansible.builtin.import_playbook: site_linux_web.yml


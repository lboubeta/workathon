---
# Rulebook esqueleto — webhook Gitea → Job Template CaC
# Activar en EDA con Decision Environment del lab y credencial AAP.
#
# Ajustar: nombres de JT, filtros de repo/branch, credenciales.

- name: Gitea push triggers CaC apply
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000
        # En AAP EDA suele usarse Event Stream; este source vale para lab/dev.
        # Sustituir por el source del Event Stream según versión del lab.

  rules:
    - name: On push to starter repo apply CaC
      condition: |
        event.payload.ref is defined and
        event.payload.repository.name is match(".*starter.*")
      action:
        run_job_template:
          name: "tN-apply-cac"
          organization: "tN-org"
          # job_args / extra_vars opcionales según payload
          # retries: 1

    # Ejemplo de filtro por path (si el payload incluye commits):
    # - name: Only templates or group_vars changes
    #   condition: event.payload.commits[0].modified is search("templates|group_vars")
    #   action:
    #     run_job_template:
    #       name: "tN-deploy-linux-web"
    #       organization: "tN-org"

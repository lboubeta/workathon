---
# Rulebook — webhook/Event Stream → Job Template CaC
# En AAP EDA 2.5+: el source se sustituye por el Event Stream vía source_mappings
# en la Activation (UI o API). El bloque ansible.eda.webhook es el placeholder.
#
# Ajustar: nombre JT / organization / filtros repo-branch.

- name: Gitea push triggers CaC apply
  hosts: all
  sources:
    - name: workathon_webhook
      ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000

  rules:
    - name: On push to starter repo apply CaC
      condition: >
        event.payload is defined and (
          (event.payload.ref is defined and event.payload.repository.name is match(".*starter.*"))
          or
          (event.payload.repository is defined and event.payload.ref is match("refs/heads/main"))
          or
          event.meta is defined
        )
      action:
        run_job_template:
          name: "facilitator-apply-cac"
          organization: "facilitator"

    # Lab teams: cambiar a tN-apply-cac / tN-org
